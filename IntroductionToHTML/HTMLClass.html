<!--What Are IDs and Classes, and When Should You Use Them-->

<!--The id attribute adds a unique identifier to an HTML element.-->

<!--Here is an example of an h1 element with an id of title.-->

<!--Below the h1 element, we can add an h2 element with an id set to "subtitle". We can write whatever text we 
like for the h2 and you will see the changes in the preview window.-->

<h1 id="title">Moview Review Page</h1>

<!--You can reference the "id" name of "title" within our JavaScript or CSS. 
Here's a CSS example referencing the id of title to change the text color to red.-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
       name="viewport"
       content="width=device-width, initial-scale=1.0" />
    <title>Review page Example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1 id="title">Movie Review Page</h1>
  </body>
</html>


#title {
  color: red;
}

<!--
The hash symbol (#) in front of title, tells the computer you want to target an id with that "value.id" names 
should not be used more than once, and they should always be unique. Another thing to note about id values, 
is that they cannot have spaces in them. Here is an example of applying the words main and heading to an 
id attribute value
-->
<h1 id="main heading">Main heading</h1>

<!--
Browsers will see this space as part of the id which will lead to unwanted issues when it comes to styling 
and "scripting.id" attribute values should only contain letters, digits, underscores, and dashes.

In contrast to the id attribute, the class attribute value does not need to be unique and can contain spaces.

Here is an example of applying a class called box to a div element.
-->
<div class="box"></div>

<!--
If you wanted to add multiple class names to an element, you can do so by separating the names by a space. 
Here is an updated example applying multiple classes to a div element.
-->

<div class="box red-box"></div>

<!--Here is an another example of applying multiple classes to multiple div elements.-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
       name="viewport"
       content="width=device-width, initial-scale=1.0" />
    <title>Colored boxes example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="box red-box"></div>
    <div class="box blue-box"></div>
    <div class="box red-box"></div>
    <div class="box blue-box"></div>
  </body>
</html>

.box {
  width: 100px;
  height: 100px;
}

.red-box {
  background-color: red;
}

.blue-box {
  background-color: blue;
}

<!--So, to recap, when should you use an id versus a class? 
"Classes": are best used when you want to apply a set of styles to many elements. 
If you want to target a specific element, it is best to use "id" because those values need to be unique
-->
