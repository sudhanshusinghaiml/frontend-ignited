<!DOCTYPE html>
<!--
All pages should begin with <!DOCTYPE html>. This special string is known as a declaration and ensures the browser tries to 
meet industry-wide specifications.
<!DOCTYPE html> tells browsers that the document is an HTML5 document which is the latest version of HTML.
-->

<!--Notice that the entire contents of the page are nested within an html element. 
The html element is the root element of an HTML page and wraps all content on the page.
We can also specify the language of our page by adding the lang attribute to the html element.
-->

<html lang="en">
    <!--The head element is used to contain metadata about the document, such as its title, links to stylesheets, and scripts. 
    Metadata is information about the page that isn't displayed directly on the page.
    -->
    <head>
        <!-- We can set browser behavior by adding meta elements in the head
        Inside the head element, nest a meta element with a charset attribute set to the value of utf-8. 
        This tells the browser how to encode characters for the page.
        Note that the meta element is a void element
        -->
        <meta charset="utf-8" />
        <!--The title element determines what browsers show in the title bar or tab for the page.-->
        <title>CatPhotoApp</title>

    </head>
    <!--Notice that everything you've added to the page so far is inside the "body" element. 
    All page content elements that should be rendered to the page go inside the body element. 
    However, other important information goes inside the "head" element.
    -->

    <body>
    <!--The main element is used to represent the main content of the body of an HTML document. 
    Content inside the main element should be unique to the document and should not be repeated 
    in other parts of the document.
    -->
        <main>
            <h1>CatPhotoApp</h1>

            <!--Before adding any new content, you should make use of a section element to separate the cat photos content 
            from the future content. The section element is used to define sections in a document, such as chapters, 
            headers, footers, or any other sections of the document. It is a semantic element that helps with SEO and 
            accessibility.
            -->
            <section>

                <h2>Cat Photos</h2>
                
                <!--<p>Everyone loves cute cats online!</p> -->
                <p>Everyone loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cats</a> online!</p>
                
                <!--The target attribute specifies where to open the linked document. target="_blank" opens the linked document in a new tab or window-->
                <p>See more <a href="https://freecatphotoapp.com" target="_blank" >cat photos</a> in our gallery.</p>
                
                <!--img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute orange cat lying on its back." -->
                
                <!--In previous steps, you used an anchor element to turn text into a link. Other types of 
                content can also be turned into a link by wrapping it in anchor tags. -->
                <a href="https://freecatphotoapp.com">
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute orange cat lying on its back.">
                </a>

            </section>

            <section>
                <h2>Cat Lists</h2>
                <h3>Things cats love:</h3>
                <!--To create an unordered list of items, you can use the ul element.-->
                <ul>
                    <!--The li element is used to create a list item in an ordered or unordered list.-->
                    <li>catnip</li>
                    <li>laser pointers</li>
                    <li>lasagna</li>
                </ul>
                
                <!--img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="A slice of lasagna on a plate" / -->

                <!--The figure element represents self-contained content and will allow you to associate an image with a caption -->
                <!--A figure caption (figcaption) element is used to add a caption to describe the image contained within the figure element.-->
                <!--
                    <figure>
                        <img src="image.jpg" alt="A description of the image">
                        <figcaption>A cute cat</figcaption>
                    </figure> 
                -->

                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="A slice of lasagna on a plate" />
                    <!--To place emphasis on a specific word or phrase, you can use the em element.-->
                    <figcaption>Cats <em>love</em> lasagna</figcaption>
                </figure>

                <h3>Top 3 things Cats hate:</h3>

                <!--The code for an ordered list (ol) is similar to an unordered list, but list items in an ordered list are numbered when displayed.-->
                <ol>
                    <li>flea treatment</li>
                    <li>thunder</li>
                    <li>other cats</li>
                </ol>

                <figure>
                    <!--To improve the accessibility of the image we added, add an alt attribute with the text-->
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg" alt="Two tabby kittens sleeping together on a couch." />
                    <!--The strong element is used to indicate that some text is of strong importance or urgent-->
                    <figcaption>Cats <strong>hate</strong> other cats</figcaption>
                </figure>

            </section>
        
        </main>

    <!--The footer element is used to define a footer for a document or section. A footer typically contains information about the 
    author of the document, copyright data, links to terms of use, contact information, and more
    -->
        <footer>
            <p>No Copyright - <a href="https://www.freecodecamp.org" >freeCodeCamp.org</a></p> 
        </footer>

    </body>
</html>
