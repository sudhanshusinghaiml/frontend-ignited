<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heart Icon</title> 
    </head>
    <body>
        <!--We learned about svg elements and how they're often used as icons in projects. 
        In real-world codebases, we would typically rely on icon libraries, so we don't need to create svg elements from scratch. 
        However, in this workshop, we'll build a heart icon to learn about the core attributes used inside an svg element.
        -->

        <!--We should set the width and height attributes for the svg element. As you are creating an icon, both values should be set small-->
        <!--The viewBox attribute controls what part of the image is visible inside the SVG. The first two numbers (0 0) set the starting
        position of the viewBox — the top-left corner (x and y). The next two numbers (50 50) define the viewBox's width and height.
        <svg viewBox="0 0 50 50"></svg>
        -->
        <svg width="24" height="24" fill="red" viewBox="0 0 24 24">
            <!--The path element needs its shape defined. That is where the d attribute comes in. It is used to create a series of command 
            letters and numbers that draw a shape. These letters represent commands like move to, draw line, and close, while the numbers 
            represent coordinates
            -->
            <path d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"></path>
        </svg>
    </body>
</html>
